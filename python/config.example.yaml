# 复制为 config.yaml 后修改
# cp config.example.yaml config.yaml

ble:
  # 设备名包含此字符串即可（写全名如 NRF_EPD_459F 更准）
  name_prefix: "NRF_EPD_459F"
  # 扫描到后填地址更稳（Windows: python -m eink_push scan）
  address: ""
  scan_timeout: 30
  connect_retries: 5

display:
  width: 400
  height: 300
  # threeColor | bw
  color_mode: threeColor

# 画面来源：demo | api | image | cc_switch
# cc_switch = 读取本机 ~/.cc-switch/cc-switch.db 的「当天」用量
source: cc_switch

cc_switch:
  db_path: ""          # 空 = ~/.cc-switch/cc-switch.db
  include_cache: false # 是否计入 cache tokens

# source: api 时
api:
  url: "https://example.com/api/token-usage"
  # 可选
  headers:
    # Authorization: "Bearer YOUR_TOKEN"
  timeout: 30

# source: image 时用本地图片路径
image_path: ""

# source: demo / api 时的默认字段（api 会覆盖同名字段）
token:
  total: 2480000
  limit: 3500000
  reset_days: 20
  codex: 986000
  claude: 742000
  grok: 496000
  deepseek: 256000

# 推送前把预览图存一份（可选）
save_preview: "preview.png"
